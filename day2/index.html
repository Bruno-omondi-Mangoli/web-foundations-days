<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture your thoughts in seconds.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <label for="note-input">New note</label>
          <input
            type="text"
            id="note-input"
            name="note"
            placeholder="What do you want to remember?"
            required
          />
          <button type="submit">Add Note</button>
        </form>
      </section>

      <section>
        <h2>Your notes</h2>
        <ul id="notes-list">
          <li class="note">Buy milk</li>
          <li class="note">Call Grace</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes</p>
    </footer>
  </body>
</html>
